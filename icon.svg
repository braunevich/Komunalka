<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a6e"/>
      <stop offset="100%" style="stop-color:#2563c4"/>
    </linearGradient>
    <linearGradient id="house" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c8d8f8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd166"/>
      <stop offset="100%" style="stop-color:#f4a942"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <rect width="512" height="512" rx="112" ry="112" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0"/>
  <line x1="0" y1="170" x2="512" y2="170" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="340" x2="512" y2="340" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="170" y1="0" x2="170" y2="512" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="512" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- House body -->
  <path d="M256 130 L370 220 L370 370 L142 370 L142 220 Z" fill="url(#house)" opacity="0.95"/>

  <!-- Roof -->
  <path d="M118 235 L256 118 L394 235" fill="none" stroke="white" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Door -->
  <rect x="220" y="285" width="72" height="85" rx="36" fill="#2563c4" opacity="0.7"/>

  <!-- Window left -->
  <rect x="158" y="255" width="48" height="44" rx="8" fill="#5b93ff" opacity="0.6"/>
  <!-- Window right -->
  <rect x="306" y="255" width="48" height="44" rx="8" fill="#5b93ff" opacity="0.6"/>

  <!-- Lightning bolt -->
  <path d="M272 148 L238 218 L262 218 L240 278 L296 200 L268 200 L290 148 Z" fill="url(#bolt)" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Bottom shine -->
  <ellipse cx="256" cy="480" rx="120" ry="8" fill="rgba(255,255,255,0.08)"/>
</svg>
